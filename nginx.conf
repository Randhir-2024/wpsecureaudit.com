server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Internal rewrite: map page.html requests to page/index.html
    location ~ \.html$ {
        rewrite ^/(.*)\.html$ /$1/index.html last;
    }

    # Clean URLs: map page to page/index.html
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Enable compression for faster delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml;
    gzip_disable "MSIE [1-6]\.";

    # Cache assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Custom 404 page redirection
    error_page 404 /404.html;
}
