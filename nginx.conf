server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Redirect explicit index.html requests to root /
    if ($request_uri ~ ^/index\.html$) {
        return 301 /;
    }

    # Internal rewrite: map page.html requests to page/index.html (excluding index.html to prevent infinite loops)
    location ~ \.html$ {
        rewrite ^/(?!index\.html$)(?!.*\/index\.html$)(.*)\.html$ /$1/index.html last;
    }

    # Proxy authentication requests to the OAuth backend container
    location ~ ^/(auth|callback) {
        proxy_pass http://auth-server:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Clean URLs: map page to page/index.html
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Enable compression for faster delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml;
    gzip_disable "MSIE [1-6]\.";

    # Disable caching for favicon files so browser tab icons update immediately
    location ~* (favicon\.ico|favicon\.svg)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache other static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Custom 404 page redirection
    error_page 404 /404.html;
}
