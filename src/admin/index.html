<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager - WP Secure Audit</title>
    <script>
      // Polyfill crypto.randomUUID for insecure HTTP contexts (like VPS IP)
      if (typeof window.crypto === 'undefined') {
        window.crypto = {};
      }
      if (typeof window.crypto.randomUUID !== 'function') {
        window.crypto.randomUUID = function() {
          return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
          });
        };
      }
    </script>
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
      <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg"/>
</head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
<!-- Mobile Menu Handler -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const toggleBtn = document.getElementById('mobile-menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        
        if (toggleBtn && mobileMenu) {
            toggleBtn.addEventListener('click', () => {
                const isHidden = mobileMenu.classList.contains('hidden');
                if (isHidden) {
                    mobileMenu.classList.remove('hidden');
                    mobileMenu.classList.add('flex');
                    toggleBtn.innerHTML = '<span class="material-symbols-outlined text-[28px] pointer-events-none">close</span>';
                    document.body.style.overflow = 'hidden';
                } else {
                    mobileMenu.classList.add('hidden');
                    mobileMenu.classList.remove('flex');
                    toggleBtn.innerHTML = '<span class="material-symbols-outlined text-[28px] pointer-events-none">menu</span>';
                    document.body.style.overflow = '';
                }
            });
        }
        
        // Mobile dropdowns accordion toggle
        const dropdownBtns = document.querySelectorAll('.mobile-dropdown-btn');
        dropdownBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const content = btn.nextElementSibling;
                const icon = btn.querySelector('.material-symbols-outlined');
                if (content) {
                    const isHidden = content.classList.contains('hidden');
                    if (isHidden) {
                        content.classList.remove('hidden');
                        content.classList.add('flex');
                        if (icon) icon.style.transform = 'rotate(180deg)';
                    } else {
                        content.classList.add('hidden');
                        content.classList.remove('flex');
                        if (icon) icon.style.transform = '';
                    }
                }
            });
        });
    });
</script>
</body>
</html>
