<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager - WP Secure Audit</title>
    <script>
      // Polyfill crypto.randomUUID for insecure HTTP contexts (like VPS IP)
      if (typeof window.crypto === 'undefined') {
        window.crypto = {};
      }
      if (typeof window.crypto.randomUUID !== 'function') {
        window.crypto.randomUUID = function() {
          return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
          });
        };
      }
    </script>
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
      
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="favicon.svg" />
</head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // Helper function to safely format date values and prevent React Error #31
      function formatDate(val) {
        if (!val) return '';
        if (val instanceof Date) return val.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        if (typeof val === 'string') {
          const d = new Date(val);
          return isNaN(d.getTime()) ? val : d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }
        return String(val);
      }

      // Preview component for Blog Posts
      const BlogPreview = createClass({
        render: function() {
          const entry = this.props.entry;
          const title = entry.getIn(['data', 'title']) || '';
          const date = formatDate(entry.getIn(['data', 'date']));
          const description = entry.getIn(['data', 'description']) || '';
          const author = entry.getIn(['data', 'author']) || 'Security Team';
          const body = this.props.widgetFor('body');

          return h('div', { style: { padding: '24px', fontFamily: 'Inter, system-ui, sans-serif', color: '#191c1e', maxWidth: '800px', margin: '0 auto' } },
            h('div', { style: { display: 'flex', gap: '12px', alignItems: 'center', marginBottom: '12px' } },
              h('span', { style: { background: 'rgba(10,37,64,0.1)', color: '#0A2540', padding: '4px 12px', borderRadius: '12px', fontSize: '12px', fontWeight: '600' } }, 'PENETRATION TESTING'),
              h('span', { style: { color: '#74777e', fontSize: '13px', fontFamily: 'monospace' } }, date)
            ),
            h('h1', { style: { fontSize: '32px', fontWeight: '700', margin: '0 0 12px 0', lineHeight: '1.2' } }, title),
            h('p', { style: { fontSize: '18px', color: '#43474d', fontStyle: 'italic', marginBottom: '12px' } }, description),
            h('div', { style: { fontSize: '13px', color: '#74777e', marginBottom: '24px' } }, 'Author: ', h('strong', { style: { color: '#000f22' } }, author)),
            h('hr', { style: { border: 'none', borderTop: '1px solid #e0e3e5', margin: '24px 0' } }),
            h('div', { style: { fontSize: '16px', lineHeight: '1.6' } }, body)
          );
        }
      });

      // Preview component for Guides
      const GuidePreview = createClass({
        render: function() {
          const entry = this.props.entry;
          const title = entry.getIn(['data', 'title']) || '';
          const category = entry.getIn(['data', 'category']) || 'Basics';
          const date = formatDate(entry.getIn(['data', 'date']));
          const description = entry.getIn(['data', 'description']) || '';
          const body = this.props.widgetFor('body');

          return h('div', { style: { padding: '24px', fontFamily: 'Inter, system-ui, sans-serif', color: '#191c1e', maxWidth: '800px', margin: '0 auto' } },
            h('div', { style: { display: 'flex', gap: '12px', alignItems: 'center', marginBottom: '12px' } },
              h('span', { style: { background: 'rgba(0,102,255,0.1)', color: '#0066FF', padding: '4px 12px', borderRadius: '12px', fontSize: '12px', fontWeight: '600' } }, category),
              h('span', { style: { color: '#74777e', fontSize: '13px', fontFamily: 'monospace' } }, date)
            ),
            h('h1', { style: { fontSize: '32px', fontWeight: '700', margin: '0 0 12px 0' } }, title),
            h('p', { style: { fontSize: '18px', color: '#43474d', fontStyle: 'italic', marginBottom: '24px' } }, description),
            h('hr', { style: { border: 'none', borderTop: '1px solid #e0e3e5', margin: '24px 0' } }),
            h('div', { style: { fontSize: '16px', lineHeight: '1.6' } }, body)
          );
        }
      });

      // Preview component for Advisories
      const AdvisoryPreview = createClass({
        render: function() {
          const entry = this.props.entry;
          const title = entry.getIn(['data', 'title']) || '';
          const vulnType = entry.getIn(['data', 'vuln_type']) || '';
          const severity = entry.getIn(['data', 'severity']) || 'High';
          const cve = entry.getIn(['data', 'cve']) || '';
          const date = formatDate(entry.getIn(['data', 'date']));
          const description = entry.getIn(['data', 'description']) || '';
          const remediation = this.props.widgetFor('remediation');
          const body = this.props.widgetFor('body');

          return h('div', { style: { padding: '24px', fontFamily: 'Inter, system-ui, sans-serif', color: '#191c1e', maxWidth: '800px', margin: '0 auto' } },
            h('div', { style: { display: 'flex', gap: '12px', alignItems: 'center', marginBottom: '12px' } },
              h('span', { style: { background: '#EF4444', color: '#FFF', padding: '4px 12px', borderRadius: '12px', fontSize: '12px', fontWeight: '700' } }, severity.toUpperCase()),
              vulnType ? h('span', { style: { background: 'rgba(10,37,64,0.1)', color: '#0A2540', padding: '4px 12px', borderRadius: '12px', fontSize: '12px' } }, vulnType) : null,
              cve ? h('span', { style: { color: '#74777e', fontSize: '13px', fontFamily: 'monospace' } }, cve) : null,
              h('span', { style: { color: '#74777e', fontSize: '13px', fontFamily: 'monospace' } }, date)
            ),
            h('h1', { style: { fontSize: '32px', fontWeight: '700', margin: '0 0 12px 0' } }, title),
            h('p', { style: { fontSize: '18px', color: '#43474d', fontStyle: 'italic', marginBottom: '24px' } }, description),
            h('hr', { style: { border: 'none', borderTop: '1px solid #e0e3e5', margin: '24px 0' } }),
            remediation ? h('div', { style: { background: '#FFFBEB', border: '1px solid #F59E0B', padding: '16px', borderRadius: '8px', marginBottom: '24px' } },
              h('h3', { style: { color: '#B45309', margin: '0 0 8px 0', fontSize: '16px' } }, 'Remediation'),
              remediation
            ) : null,
            h('div', { style: { fontSize: '16px', lineHeight: '1.6' } }, body)
          );
        }
      });

      CMS.registerPreviewTemplate('blog', BlogPreview);
      CMS.registerPreviewTemplate('guides', GuidePreview);
      CMS.registerPreviewTemplate('advisories', AdvisoryPreview);
    </script>
</body>
</html>
