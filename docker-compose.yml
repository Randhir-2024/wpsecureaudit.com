version: '3.8'

services:
  web:
    build: .
    image: wpsecureaudit:latest
    container_name: wpsecureaudit-web
    ports:
      - "8081:80"
    depends_on:
      - auth-server
    restart: always

  auth-server:
    image: alukovenko/decapcms-oauth2:latest
    container_name: wpsecureaudit-auth
    environment:
      - OAUTH_CLIENT_ID=${GITHUB_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - TRUSTED_ORIGIN=https://wpsecureaudit.com
      - SERVER_PORT=9000
    restart: always
